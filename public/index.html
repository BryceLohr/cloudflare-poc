<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World on Cloudflare Workers</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f6f6f7; color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14161a; color: #e8e8ea; }
        .card { background: #1e2126; border-color: #2c3038; }
      }
      .card {
        background: #fff; border: 1px solid #e3e3e6; border-radius: 12px;
        padding: 2rem 2.5rem; text-align: center; max-width: 32rem;
      }
      h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
      button {
        font: inherit; padding: .5rem 1rem; border-radius: 8px; cursor: pointer;
        border: 1px solid #f6821f; background: #f6821f; color: #fff; margin-top: 1rem;
      }
      pre {
        text-align: left; overflow-x: auto; background: rgba(127,127,127,.12);
        padding: .75rem; border-radius: 8px; margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello World 👋</h1>
      <p>Served from Cloudflare's edge. The button calls the Worker.</p>
      <button id="go">Call /api/hello</button>
      <pre id="out" hidden></pre>
    </main>
    <script>
      const out = document.getElementById("out");
      document.getElementById("go").addEventListener("click", async () => {
        out.hidden = false;
        out.textContent = "Loading…";
        try {
          const res = await fetch("/api/hello");
          out.textContent = JSON.stringify(await res.json(), null, 2);
        } catch (err) {
          out.textContent = "Request failed: " + err.message;
        }
      });
    </script>
  </body>
</html>
